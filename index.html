<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>New York Taxi</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="page-layout">
    <!-- Botões a esquerda -->
    <div class="buttom-container">
      <label for="variable-select">Variável a analisar:</label>
      <select id="variable-select">
        <option value="tip_amount">Valor da Gorjeta</option>
        <option value="total_amount">Valor Total</option>
        <option value="fare_amount">Valor da Corrida</option>
        <option value="trip_distance">Distância da Corrida</option>
      </select>

      <label for="aggregation-select" style="margin-top: 16px;">Tipo de agregação:</label>
      <select id="aggregation-select">
        <option value="SUM">Soma</option>
        <option value="AVG">Média</option>
      </select>
    </div>

    <div class="content-wrapper">
      <div class="main-layout">
        <!-- Mapa -->
        <div class="left-column">
          <svg id="map-svg"><g id="group"></g></svg>
        </div>

        <!-- Gráficos a direita -->
        <div class="right-column">
          <div class="small-chart"><svg><g id="chart1"></g></svg></div>
          <div class="small-chart"><svg><g id="chart2"></g></svg></div>
          <div class="small-chart"><svg><g id="chart3"></g></svg></div>
        </div>
      </div>

      <!-- Gráfico horizontal -->
      <div class="bottom-layout">
        <svg id="bottom-chart-svg"><g id="bottom-chart"></g></svg>
        <svg id="side-svg"><g id="side-chart"></g></svg>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
